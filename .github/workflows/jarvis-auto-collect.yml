name: JARVIS Auto Collect - YouTube & arXiv

on:
  schedule:
    # 매일 08:00 KST (23:00 UTC 전날)
    - cron: '0 23 * * *'
  workflow_dispatch:  # 수동 실행

jobs:
  jarvis-collect:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run JARVIS Auto Collect
      env:
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: |
        python jarvis_auto_collect.py

    - name: Commit results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "JARVIS Auto"
        git add JARVIS_자동수집_*.md
        git commit -m "🤖 JARVIS 자동 수집 - $(date +%Y-%m-%d)" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
