name: 🤖 JARVIS 자동 모니터링

on:
  schedule:
    # 매일 자정 한국 시간 (UTC+9)
    - cron: '0 15 * * *'  # 00:00 KST = 15:00 UTC (전날)

  # 수동 트리거도 가능
  workflow_dispatch:

jobs:
  jarvis_monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser arxiv

      - name: 🌐 Step 1: 웹 검색 모니터링
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python kms/jarvis_web_monitor.py
        continue-on-error: true

      - name: 📺 Step 2: YouTube 모니터링
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python kms/jarvis_youtube_monitor.py
        continue-on-error: true

      - name: 📄 Step 3: 논문 크롤링
        run: |
          python kms/jarvis_paper_monitor.py
        continue-on-error: true

      - name: 📡 Step 4: RSS 피드 모니터링
        run: |
          python kms/jarvis_rss_monitor.py
        continue-on-error: true

      - name: 🔐 Step 5: Phase A 통합 오케스트레이터
        run: |
          python kms/jarvis_phase_a_orchestrator.py
        continue-on-error: true

      - name: 🔍 Step 6: Phase B 데이터 검증
        run: |
          python kms/jarvis_phase_b_integrated.py
        continue-on-error: true

      - name: 💾 결과 커밋
        run: |
          git config --local user.email "jarvis@ai.local"
          git config --local user.name "JARVIS Auto Monitor"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 JARVIS Auto Update $(date '+%Y-%m-%d %H:%M:%S')" && git push)
        continue-on-error: true

      - name: 📊 성공 알림
        if: success()
        run: |
          echo "✅ JARVIS 모니터링 완료!"
          echo "📊 자료 수집 및 검증 완료"
          echo "💾 Obsidian 업데이트 완료"

      - name: ⚠️ 실패 알림
        if: failure()
        run: |
          echo "❌ JARVIS 모니터링 실패"
          echo "⚠️ 로그 확인 필요"
